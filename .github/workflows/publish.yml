name: Publish QuantumLeaper

on:
  push:
    branches: ['main']

jobs:
  deploy:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v7
      # Toolchains used by the build: 11 (java6 module), 17 (java17 module)
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: |
            11
            17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Get QuantumLeaper version
        id: get_version
        run: echo "version=$(sed -n 's/^version *= *//p' gradle.properties)" >> "$GITHUB_OUTPUT"
      - name: Deploy release version
        if: ${{ !endsWith(steps.get_version.outputs.version, '-SNAPSHOT') }}
        run: ./gradlew publish --no-daemon --stacktrace
        env:
          REPO_USER: ${{ secrets.REPO_USER }}
          REPO_PASSWORD: ${{ secrets.REPO_PASSWORD }}
