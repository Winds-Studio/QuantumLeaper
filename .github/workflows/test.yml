name: Test
on:
  push:
    paths-ignore:
      - 'license.txt'
      - 'readme.md'
      - '*.md'
      - '.gitignore'
      - '.gitattributes'
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # Toolchains used by the build: 11 (java6 module), 17 (java17 module), 21 (end-to-end tests),
      # 25 (Origami end-to-end test)
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: |
            11
            17
            25
            21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            build/reports/tests/
            java17/build/reports/tests/
