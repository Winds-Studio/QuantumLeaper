name: Deploy
on:
  push:
    tags: ['v*']

jobs:
  deploy:
    name: Deploy
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v7
      # Toolchains used by the build: 11 (java6 module), 17 (java17 module)
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: |
            11
            17
      # Also validates the Gradle wrapper
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Deploy release
        run: ./gradlew -Dorg.gradle.parallel=true publish --no-daemon --stacktrace
        env:
          ORG_GRADLE_PROJECT_quantumleaperUsername: ${{ secrets.REPO_USER }}
          ORG_GRADLE_PROJECT_quantumleaperPassword: ${{ secrets.REPO_PASSWORD }}
